server:
  port: 0

spring:
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    # H2 使用 MySQL 兼容模式，保证 schema.sql 能继续复用。
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:java_demo_task_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always

app:
  jwt:
    # 测试密钥长度大于 32 字节，满足 HS256 要求，仅用于本地测试。
    secret: java-demo-test-secret-change-me-32chars
    expiration-seconds: 7200

java-demo:
  services:
    # 集成测试通过 @MockBean 替换 Dubbo 用户校验与 Feign 通知调用，不依赖真实下游实例。
    user-service-name: java-demo-app
    notification-service-name: notification-service
  rpc:
    user-validation-mode: dubbo
    notification-mode: openfeign

dubbo:
  application:
    name: task-service-test
    qos-enable: false
  registry:
    # 自动化测试不访问真实 Nacos，避免 Dubbo 在启动阶段依赖外部注册中心。
    address: N/A
  protocol:
    name: dubbo
    port: -1
  consumer:
    check: false
    timeout: 3000
    retries: 0

logging:
  file:
    # 测试日志写入 target，避免污染真实运行日志目录。
    name: target/test-logs/task-service-test.log

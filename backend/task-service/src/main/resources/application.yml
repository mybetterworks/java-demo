server:
  port: ${TASK_SERVER_PORT:8093}

spring:
  application:
    name: task-service
  config:
    import:
      - optional:nacos:java-demo-common.yml
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        enabled: ${JAVA_DEMO_NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${JAVA_DEMO_NACOS_REGISTER_ENABLED:true}
        server-addr: ${JAVA_DEMO_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${JAVA_DEMO_NACOS_NAMESPACE:public}
        group: ${JAVA_DEMO_NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${JAVA_DEMO_NACOS_CONFIG_ENABLED:true}
        server-addr: ${JAVA_DEMO_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${JAVA_DEMO_NACOS_NAMESPACE:public}
        group: ${JAVA_DEMO_NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        encode: UTF-8
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/java_demo_task?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${JAVA_DEMO_TASK_DB_USERNAME:java_demo}
    password: ${JAVA_DEMO_TASK_DB_PASSWORD:java_demo_pwd}
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JAVA_DEMO_JWT_SECRET:java-demo-v0-1-local-secret-change-me-32chars}
    expiration-seconds: ${JAVA_DEMO_JWT_EXPIRATION_SECONDS:7200}

java-demo:
  services:
    user-service-url: ${JAVA_DEMO_USER_SERVICE_URL:http://java-demo-app}
    notification-service-url: ${JAVA_DEMO_NOTIFICATION_SERVICE_URL:http://notification-service}
    discovery-enabled: ${JAVA_DEMO_SERVICE_DISCOVERY_ENABLED:true}

logging:
  file:
    name: ${JAVA_DEMO_TASK_LOG_FILE:logs/task-service.log}
  logback:
    rollingpolicy:
      max-file-size: ${JAVA_DEMO_LOG_MAX_FILE_SIZE:10MB}
      max-history: ${JAVA_DEMO_LOG_MAX_HISTORY:7}
  level:
    root: ${JAVA_DEMO_LOG_LEVEL_ROOT:INFO}
    com.example.javademo.task: ${JAVA_DEMO_TASK_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [task-service] [%thread] [requestId=%X{requestId:-no-request}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [task-service] [%thread] [requestId=%X{requestId:-no-request}] %logger{36} - %msg%n"

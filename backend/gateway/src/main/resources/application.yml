server:
  port: ${GATEWAY_SERVER_PORT:8092}

spring:
  application:
    name: java-demo-gateway
  config:
    import:
      - optional:nacos:java-demo-common.yml
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        enabled: ${JAVA_DEMO_NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${JAVA_DEMO_NACOS_REGISTER_ENABLED:true}
        server-addr: ${JAVA_DEMO_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${JAVA_DEMO_NACOS_NAMESPACE:public}
        group: ${JAVA_DEMO_NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${JAVA_DEMO_NACOS_CONFIG_ENABLED:true}
        server-addr: ${JAVA_DEMO_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${JAVA_DEMO_NACOS_NAMESPACE:public}
        group: ${JAVA_DEMO_NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        encode: UTF-8
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false
    gateway:
      routes:
        - id: java-demo-backend-api
          uri: ${JAVA_DEMO_BACKEND_URI:lb://java-demo-app}
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/health,/v3/api-docs,/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**
        - id: java-demo-task-api
          uri: ${JAVA_DEMO_TASK_SERVICE_URI:lb://task-service}
          predicates:
            - Path=/api/tasks/**
        - id: java-demo-notification-api
          uri: ${JAVA_DEMO_NOTIFICATION_SERVICE_URI:lb://notification-service}
          predicates:
            - Path=/api/notifications/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            exposed-headers:
              - Authorization
              - X-Gateway-User-Id
              - X-Gateway-Username
            allow-credentials: true

app:
  jwt:
    secret: ${JAVA_DEMO_JWT_SECRET:java-demo-v0-1-local-secret-change-me-32chars}
    expiration-seconds: ${JAVA_DEMO_JWT_EXPIRATION_SECONDS:7200}

logging:
  file:
    name: ${JAVA_DEMO_GATEWAY_LOG_FILE:logs/java-demo-gateway.log}
  logback:
    rollingpolicy:
      max-file-size: ${JAVA_DEMO_LOG_MAX_FILE_SIZE:10MB}
      max-history: ${JAVA_DEMO_LOG_MAX_HISTORY:7}
  level:
    root: ${JAVA_DEMO_LOG_LEVEL_ROOT:INFO}
    com.example.javademo.gateway: ${JAVA_DEMO_GATEWAY_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [java-demo-gateway] [%thread] [requestId=%X{requestId:-no-request}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [java-demo-gateway] [%thread] [requestId=%X{requestId:-no-request}] %logger{36} - %msg%n"

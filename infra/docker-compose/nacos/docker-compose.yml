services:
  nacos:
    # v0.6 使用单节点 Nacos 先打通注册发现与配置中心；集群化留到后续阶段。
    image: nacos/nacos-server:v2.4.3
    container_name: java-demo-nacos-1
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_SERVERS: ""
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      # 8848 为控制台与 HTTP OpenAPI；9848/9849 供 Nacos 2.x 的 gRPC 通信使用。
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      # 数据与日志分卷，便于后续排障和集群扩展。
      - java-demo-nacos-data:/home/nacos/data
      - java-demo-nacos-logs:/home/nacos/logs
    networks:
      - java-demo-nacos-net
    healthcheck:
      # 只做最小可用性验证：确认容器内部 8848 端口已经打开。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8848'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

volumes:
  java-demo-nacos-data:
    name: java-demo-nacos-data
  java-demo-nacos-logs:
    name: java-demo-nacos-logs

networks:
  java-demo-nacos-net:
    name: java-demo-nacos-net

# v0.9 MinIO single-node object storage.
# It keeps MinIO as an independent infrastructure container, matching the
# project rule that middleware services should not be bundled together.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: java-demo-minio-1
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${JAVA_DEMO_MINIO_ROOT_USER:-java_demo_minio}
      MINIO_ROOT_PASSWORD: ${JAVA_DEMO_MINIO_ROOT_PASSWORD:-java_demo_minio_pwd_123}
    ports:
      - "${JAVA_DEMO_MINIO_API_PORT:-9000}:9000"
      - "${JAVA_DEMO_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - java-demo-minio-data:/data
    networks:
      - java-demo-minio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  java-demo-minio-data:
    name: java-demo-minio-data

networks:
  java-demo-minio-net:
    name: java-demo-minio-net
